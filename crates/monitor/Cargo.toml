[package]
name = "digitrace-monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone headless monitor: samples hardware/temperature/network and publishes to shared memory"

[[bin]]
name = "digitrace-monitor"
path = "src/main.rs"

[dependencies]
timetrace-core = { path = "../core" }
metrics = { path = "../metrics" }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
