[workspace]
members = [
    "crates/core",
    "crates/metrics",
    "crates/metrics-viewer",
    "crates/monitor",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging", "Win32_System_Threading",
    "Win32_System_ProcessStatus", "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com",
    "Win32_System_TaskScheduler", "Win32_Foundation", "Win32_System_Time",
    "Win32_System_SystemInformation", "Win32_UI_Accessibility",
    "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
    "Win32_Security", "Win32_System_Diagnostics_Etw", "Win32_System_LibraryLoader", "Win32_System_IO", "Win32_UI_Shell",
] }
sysinfo = "0.33"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "2"
dirs = "6"
winreg = "0.54"
aes-gcm = "0.10"
rand = "0.8"

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"
codegen-units = 1
panic = "abort"


