name: Release

# 推送 v* tag（如 v2.23.0）时自动构建并发布 GitHub Release。
# 用法：git tag v2.23.0 && git push origin v2.23.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Build release exe
        working-directory: src-tauri
        run: cargo build --release

      - name: Build lite viewer + standalone monitor
        run: cargo build --release -p metrics-viewer -p digitrace-monitor

      - name: Package assets (exe + sha256)
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $exe = "digitrace-$ver.exe"
          Copy-Item target/release/timetrace.exe "target/release/$exe"
          $hash = (Get-FileHash "target/release/$exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content "target/release/$exe.sha256" $hash -Encoding ascii
          # Lite 实时指标查看器（零依赖 Win32，独立 exe，读取共享内存）
          $lite = "digitrace-lite-viewer-$ver.exe"
          Copy-Item target/release/metrics-viewer.exe "target/release/$lite"
          $liteHash = (Get-FileHash "target/release/$lite" -Algorithm SHA256).Hash.ToLower()
          Set-Content "target/release/$lite.sha256" $liteHash -Encoding ascii
          # 独立监控进程（无界面常驻，写共享内存；Lite 查看器可自动拉起）
          $mon = "digitrace-monitor-$ver.exe"
          Copy-Item target/release/digitrace-monitor.exe "target/release/$mon"
          $monHash = (Get-FileHash "target/release/$mon" -Algorithm SHA256).Hash.ToLower()
          Set-Content "target/release/$mon.sha256" $monHash -Encoding ascii
          Write-Host "asset=$exe sha256=$hash"
          Write-Host "asset=$lite sha256=$liteHash"
          Write-Host "asset=$mon sha256=$monHash"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag.TrimStart('v')
          # 从 CHANGELOG.md 提取本版本的发布说明（## vX.Y.Z 到下一个 ## v 之间的条目）。
          $notes = @()
          $lines = Get-Content "CHANGELOG.md" -Encoding UTF8
          $in = $false
          foreach ($line in $lines) {
            if ($line -match "^## v$([regex]::Escape($ver))\b") { $in = $true; continue }
            if ($in -and $line -match "^## v") { break }
            if ($in) { $notes += $line }
          }
          $body = @("# 数迹 v$ver", "", ($notes -join "`n").Trim(), "",
            "---",
            "自动构建发布（GitHub Actions）。SHA-256 见附件 digitrace-$ver.exe.sha256。",
            "组件：`digitrace-$ver.exe`（完整版）· `digitrace-monitor-$ver.exe`（独立监控）· `digitrace-lite-viewer-$ver.exe`（Lite 查看器）") -join "`n"
          # v2.26.0 之前没有独立监控 / Lite 查看器，组件行只对 v2.26.0+ 展示。
          if ([version]$ver -lt [version]"2.26.0") {
            $body = @("# 数迹 v$ver", "", ($notes -join "`n").Trim(), "",
              "---",
              "自动构建发布（GitHub Actions）。SHA-256 见附件 digitrace-$ver.exe.sha256。") -join "`n"
          }
          # 幂等：tag 被移动后重跑时，先删除已存在的 release 再重建，避免「同名已存在」报错。
          gh release delete $tag --repo LINGYIIIIIIII/digitrace --yes 2>$null
          gh release create $tag "target/release/digitrace-$ver.exe" "target/release/digitrace-$ver.exe.sha256" "target/release/digitrace-lite-viewer-$ver.exe" "target/release/digitrace-lite-viewer-$ver.exe.sha256" "target/release/digitrace-monitor-$ver.exe" "target/release/digitrace-monitor-$ver.exe.sha256" --repo LINGYIIIIIIII/digitrace --title "数迹 v$ver" --notes $body
